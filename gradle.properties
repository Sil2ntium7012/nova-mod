# ===================================================================
# Luna Client Hidden Mod - 공용 Gradle 속성
#
# 18차(멀티버전 지원)부터, 버전마다 달라지는 값(minecraft_version/yarn_mappings/
# loader_version/fabric_version/modmenu_version)은 여기가 아니라 각
# versions/<버전>/gradle.properties 에 있습니다. 여기 남은 건 모든 버전이 공통으로
# 쓰는 값뿐입니다.
# ===================================================================

mod_version=0.1.0
maven_group=kr.lunaslight
# 49-212차: jar 이름에 루나/노바를 넣지 않는다 - builtin-mod-<마크버전>-<모드버전>+mc<마크버전>.jar
archives_base_name=builtin-mod

# Gradle Daemon 힙 메모리 - 기본값(512MB)이 너무 작아서 1.21.11처럼 큰 버전
# 리매핑할 때 OOM 경고가 남. 3GB로 올림. 49-37차: 40개 병렬 전체 빌드에서 generateLunaYarnMap이
# "Java heap space"로 죽어 4GB로(태스크 자체도 스트리밍으로 바꿈 - loom-common.gradle 참고). PC RAM 32GB.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G
org.gradle.parallel=true
