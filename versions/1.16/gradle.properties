# ✅ 2026-08-28 - 28차: meta.fabricmc.net(yarn/loader) + Modrinth API(fabric-api/modmenu)에서
# 직접 조회 후 raw 배열을 전부 나열시켜 최고 build/최신 date_published를 검증한 값.
# legacy_compat_dir: DrawContext/RenderTickCounter가 존재하지 않는 시대라, loom-common.gradle이
# 이 키를 보고 compat/legacy-era1/ shim 소스를 추가 + gui/ 패키지를 컴파일에서 제외함
# (claude/nova-mod-todo.md 28차 참고 - 이 버전엔 Right Shift 설정 메뉴가 아직 없음).
minecraft_version=1.16
yarn_mappings=1.16+build.4
loader_version=0.19.3
# 35차: 0.13.1은 ClientTickEvents/ClientPlayConnectionEvents/PlayerBlockBreakEvents가 없는 너무 이른
# 빌드였음(maven-metadata.xml 확인 결과 -1.16 태그의 최고 빌드는 0.42.0) - 그걸로 교체.
fabric_version=0.42.0+1.16

legacy_compat_dir=compat/legacy-era1
merged_jar=true
# 35차: net.fabricmc.fabric.api.client.message.v1.ClientReceiveMessageEvents가 1.19.3 이전 Fabric API엔
# 아예 없어서(mixin 없인 대체 불가) 채팅강화/메시지컬러라이저/TPS 3개 모듈을 컴파일에서 제외.
no_message_events=true
# 35차: org.slf4j는 1.18.2부터 번들됨 - 그 이전 버전은 compat/legacy-no-slf4j/ shim(log4j로 위임)을 얹음.
legacy_no_slf4j=true
