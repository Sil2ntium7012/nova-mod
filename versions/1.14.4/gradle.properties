# 49-158차(사용자: "1.14 버전 추가"): 1.14.4 - 1.15.2(37차)와 같은 "Era 0" 설정에서 시작.
# 값 출처: FabricMC/fabric 1.14 브랜치 build.gradle(baseVersion 0.28.5, mcVersion 1.14.4 - raw GitHub 확인),
# FabricMC/intermediary mappings/1.14.4.tiny(raw GitHub 확인). yarn 빌드 번호는 1.14.4의 마지막 빌드.
minecraft_version=1.14.4
yarn_mappings=1.14.4+build.18
loader_version=0.19.3
fabric_version=0.28.5+1.14
# 49-171차: 이 시대 Fabric API의 모드 id는 "fabric"(fabric-api는 0.42.0부터) - fabric.mod.json depends에 이 이름을 넣는다.
fabric_api_id=fabric

# ModMenu: 1.15.2와 같이 Modrinth에 이 버전용 릴리스가 없어 키를 생략(loom-common.gradle이 hasProperty로 처리).

legacy_compat_dir=compat/legacy-era0
merged_jar=true
no_message_events=true
legacy_no_slf4j=true
no_container_modules=true
# 1.14.x에는 MatrixStack(1.15에 생김)이 없다 - compat/legacy-no-matrix shim을 얹는다(loom-common.gradle 49-158차).
legacy_no_matrix=true
