# ✅ 2026-08-29 - 37차: Fabric 공식 raw Yarn 매핑 파일(FabricMC/yarn) + meta.fabricmc.net(yarn 빌드
# 목록) + GitHub 태그(FabricMC/fabric-api 0.28.5+1.15) 직접 조회로 검증한 값.
#
# legacy_compat_dir: DrawContext/RenderTickCounter가 존재하지 않는 시대라, loom-common.gradle이
# 이 키를 보고 compat/legacy-era0/ shim 소스를 추가 + gui/ 패키지를 컴파일에서 제외함(이 버전에도
# Right Shift 설정 메뉴는 없음 - legacy-era1과 동일한 이유, claude/nova-mod-todo.md 37차 참고).
# legacy-era1과 다른 전용 폴더를 쓰는 이유: DrawContext 내부 구현이 실제 API 차이 때문에 다름
# (1.15.2는 DrawableHelper.fill이 매트릭스 없는 오버로드, drawTextWithShadow 자체가 없어서
# TextRenderer.drawWithShadow를 직접 호출).
minecraft_version=1.15.2
yarn_mappings=1.15.2+build.17
loader_version=0.19.3

# Fabric API 0.28.5+1.15가 1.15.2를 타겟한 마지막(그리고 유일한) 릴리스(2021-01-19, GitHub 태그
# 확인). ClientTickEvents/ClientLifecycleEvents/KeyBindingHelper/HudRenderCallback/ItemTooltipCallback은
# 이 빌드에도 존재(GitHub raw 200 확인) - 전부 NovaCompat이 Class.forName으로 리플렉션 조회하므로
# 컴파일엔 문제없음. WorldRenderEvents(신/구 패키지 둘 다)와 ClientReceiveMessageEvents(채팅 수신
# 이벤트)는 이 빌드에 아예 없음(404 확인) - 전자는 NovaCompat이 이미 Class.forName 실패를
# 안전하게 흡수하도록 돼있어 그냥 그 기능만 조용히 빠지고, 후자는 아래 no_message_events로
# 컴파일 자체에서 제외.
fabric_version=0.28.5+1.15
# 49-171차: 이 시대 Fabric API의 모드 id는 "fabric"(fabric-api는 0.42.0부터).
fabric_api_id=fabric

# ModMenu: Modrinth API(공식 배포처, loom-common.gradle의 maven.modrinth 좌표가 여길 봄)에
# 1.15.2를 지원하는 릴리스가 없음(CurseForge에만 아주 오래된 별도 빌드가 있으나 Modrinth maven
# 좌표로 못 찾음 - 31~32차의 ModMenu 좌표 문제와 같은 함정). 1.16/1.16.2/1.16.3과 동일하게
# modmenu_version 키 자체를 생략 - loom-common.gradle이 hasProperty로 조건부 처리하므로
# ModMenu "라이브러리" 배지만 안 뜰 뿐 모드 동작에는 영향 없음.

legacy_compat_dir=compat/legacy-era0
merged_jar=true
# 1.19.3 이전 Fabric API엔 ClientReceiveMessageEvents가 없음(mixin 없인 대체 불가) - 채팅강화/
# 메시지컬러라이저/TPS 3개 모듈을 컴파일에서 제외(35차와 동일 패턴).
no_message_events=true
# org.slf4j는 1.18.2부터 번들됨 - 1.15.2는 log4j만 있어서 compat/legacy-no-slf4j/ shim을 얹음.
legacy_no_slf4j=true
# Container/SlotActionType/PlayerEntity 핸들러 필드명이 전부 달라(net.minecraft.container.*,
# playerContainer/container) clickSlot 기반 자동조작 3개 모듈(AutoRefillModule/DropDumpModule/
# ElytraSwapModule)만 컴파일에서 제외 - loom-common.gradle 39차 참고.
no_container_modules=true
